<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIPA performance metrics</title>
    <link rel="shortcut icon" href="/favicon-perf.png" type="image/png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="nipa.js?v=20261013"></script>
    <script src="metric-table.js"></script>
    <script>
        nipa_load_sitemap();
        nipa_load_sponsors();
    </script>
    <link rel="stylesheet" href="nipa.css">
    <style>
        #metric-controls {
            margin: 1em 0;
        }
        #metric-controls label {
            display: inline-block;
            margin: 0.3em 1em 0.3em 0;
        }
        #metric-controls select,
        #metric-controls input[type="text"] {
            min-width: 14em;
        }
        #metric-controls input[type="number"] {
            width: 6em;
        }
        #metric-table-wrapper {
            max-width: 100%;
            overflow: auto;
        }
        #metric-table {
            width: auto;
            white-space: nowrap;
        }
        #metric-table thead th {
            background: white;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        #metric-table th:first-child,
        #metric-table td:first-child {
            left: 0;
            position: sticky;
            z-index: 1;
        }
        #metric-table th:first-child {
            z-index: 3;
        }
        #metric-table tbody td:first-child {
            background: white;
        }
        #metric-table .metric-date {
            font-size: 0.8em;
            padding: 0.25em;
            text-align: left;
            writing-mode: vertical-rl;
        }
        #metric-table .metric-case {
            padding: 0.35em 0.6em;
        }
        #metric-table .metric-case a {
            color: inherit;
            text-decoration: none;
        }
        #metric-table .metric-dimensions {
            color: #666;
            display: block;
            font-size: 0.75em;
        }
        #metric-table .metric-result {
            padding: 0;
            text-align: center;
        }
        #metric-table .metric-result a {
            color: white;
            display: block;
            min-width: 2em;
            padding: 0.45em 0;
            text-decoration: none;
        }
        .metric-regression-ok {
            background: green;
        }
        .metric-regression {
            background: #d06060;
        }
        .metric-regression-insufficient {
            background: #e3b341;
        }
        .metric-regression-untracked {
            background: #d0d0d0;
        }
        #metric-table .metric-regression-insufficient a,
        #metric-table .metric-regression-untracked a {
            color: #222;
        }
        #metric-legend {
            font-size: 0.85em;
        }
        #metric-legend span {
            display: inline-block;
            margin-right: 1.5em;
        }
        #metric-legend i {
            border: 1px solid #aaa;
            display: inline-block;
            height: 0.8em;
            margin-right: 0.3em;
            width: 0.8em;
        }
    </style>
</head>
<body onload="do_it();">
<div id="sitemap"></div>
<h2>Performance metrics</h2>
<fieldset id="metric-controls" disabled>
    <legend>Filtering</legend>
    <div class="row-small">
        <div class="column-small">
            <label for="date-count">Date column count<br>
                <input type="number" id="date-count" min="1" value="30">
            </label>
            <label for="branch-filter">Branch prefix<br>
                <select id="branch-filter"></select>
            </label>
            <label for="runner-filter">Runner<br>
                <select id="runner-filter"></select>
            </label>
            <label for="name-filter">Test case matches (regex)<br>
                <input type="text" id="name-filter">
            </label>
        </div>
        <div class="column-small">
            <label><input type="checkbox" id="show-regression" checked>
                regressions</label><br>
            <label><input type="checkbox" id="show-ok" checked>
                within baseline</label><br>
            <label><input type="checkbox" id="show-insufficient" checked>
                insufficient history</label><br>
            <label><input type="checkbox" id="show-untracked" checked>
                untracked</label>
        </div>
        <div class="column-small">
            <fieldset>
                <legend>Sort</legend>
                <label><input type="radio" name="metric-sort"
                              id="sort-name" value="name" checked>
                    test name</label><br>
                <label><input type="radio" name="metric-sort"
                              id="sort-regression" value="regression">
                    regressions first</label>
            </fieldset>
            <p><a href="#" id="update-url-button" class="nipa-button">
                Update URL</a></p>
        </div>
    </div>
</fieldset>
<p id="metric-status">Loading...</p>
<p id="metric-legend">
    <span><i class="metric-regression-ok"></i>within baseline</span>
    <span><i class="metric-regression"></i>regression</span>
    <span><i class="metric-regression-insufficient"></i>insufficient history</span>
    <span><i class="metric-regression-untracked"></i>not tracked</span>
</p>
<div id="metric-table-wrapper">
    <table id="metric-table" hidden></table>
</div>
</body>
</html>
